# =====================================================
# Resource bundle for the Invoice Management application
# =====================================================

# --- manifest.json -----------------------------------
# XTIT: Application title in the launchpad tile
appTitle=Rechnungsmanagement
# YDES: Application description in the launchpad tile
appDescription=Verwaltung und Übersicht aller Eingangsrechnungen.

# --- Worklist (Invoice list) -------------------------
# XTIT: Title of the worklist page
worklistTitle=Rechnungen
# XMSG: Subtitle / explanatory text on the worklist page
worklistSubtitle=Übersicht aller Eingangsrechnungen mit Status, Lieferant und Beträgen.
# XTIT: Toolbar title above the table when no count is available yet
worklistTableTitle=Rechnungen
# XTIT: Toolbar title above the table including the result count, e.g. "Rechnungen (12)"
worklistTableTitleCount=Rechnungen ({0})
# XFLD: Unit label shown next to the result count when the page header is snapped
worklistResultsLabel=Treffer

# --- Filter labels -----------------------------------
filterStatus=Status
filterVendor=Lieferant
filterVendorPlaceholder=Lieferantenname eingeben
filterInvoiceDate=Rechnungsdatum
filterDateRangePlaceholder=Zeitraum auswählen
filterCurrency=Währung
filterCurrencyAll=Alle
filterAmountFrom=Bruttobetrag von
filterAmountTo=Bruttobetrag bis

# --- Status values -----------------------------------
statusFilterAll=Alle
statusDraft=Entwurf
statusPosted=Gebucht

# --- Table columns -----------------------------------
colInvoiceNumber=Rechnungsnummer
colVendor=Lieferant
colInvoiceDate=Rechnungsdatum
colGrossAmount=Bruttobetrag
colStatus=Status

# --- Table generic -----------------------------------
tableNoData=Keine Rechnungen für die aktuellen Filter gefunden.

# --- Search ------------------------------------------
searchPlaceholder=Suche nach Rechnungsnr., Lieferant oder Referenz

# --- Actions / buttons -------------------------------
actionRefresh=Aktualisieren
actionSort=Sortierung umkehren
actionClearFilters=Filter zurücksetzen
actionCreate=Neu anlegen
actionBack=Zurück
actionBackToList=Zur Rechnungsübersicht
actionEdit=Bearbeiten
actionSave=Speichern
actionCancel=Abbrechen
actionPost=Buchen

# --- Create invoice dialog ---------------------------
# XTIT: Title of the "create new invoice" dialog
createDialogTitle=Neue Rechnung anlegen
# XFLD: Field label – invoice number (mandatory)
createFieldInvoiceNumber=Rechnungsnummer
# XFLD: Field label – vendor / supplier (mandatory)
createFieldVendor=Lieferant
# XFLD: Field label – invoice date (mandatory)
createFieldInvoiceDate=Rechnungsdatum
# XFLD: Field label – currency (mandatory)
createFieldCurrency=Währung
# XFLD: Field label – due date (optional)
createFieldDueDate=Fälligkeitsdatum
# XFLD: Placeholder for the invoice number input
createInvoiceNumberPlaceholder=Rechnungsnummer eingeben
# XFLD: Placeholder for the date pickers
createDatePlaceholder=Datum auswählen
# XFLD: Placeholder / empty option of the currency select
createCurrencyPlaceholder=Währung auswählen
# XBUT: Confirm button that creates the invoice
actionCreateConfirm=Anlegen

# --- Messages ----------------------------------------
messageRefreshed=Daten wurden aktualisiert.
messageFiltersCleared=Alle Filter wurden zurückgesetzt.
messageSortAsc=Sortierung: älteste Rechnung zuerst.
messageSortDesc=Sortierung: neueste Rechnung zuerst.
messageSaveSuccess=Die Änderungen wurden gespeichert.
messageSaveError=Die Änderungen konnten nicht gespeichert werden.
messageNoChanges=Es wurden keine Änderungen vorgenommen.
messageItemAddError=Die Rechnungsposition konnte nicht angelegt werden.
messagePostSuccess=Die Rechnung wurde gebucht.
messagePostError=Die Rechnung konnte nicht gebucht werden.
messageCreateSuccess=Die Rechnung wurde angelegt.
messageCreateError=Die Rechnung konnte nicht angelegt werden.

# --- Validation --------------------------------------
validationErrorTitle=Ungültige Eingabe
validationInvoiceNumberRequired=Die Rechnungsnummer darf nicht leer sein.
validationInvoiceDateRequired=Bitte geben Sie ein Rechnungsdatum an.
validationVendorRequired=Der Lieferantenname darf nicht leer sein.
validationCurrencyRequired=Die Währung darf nicht leer sein.
validationDueDateRequired=Bitte geben Sie ein Fälligkeitsdatum an.
validationDueDatePast=Das Fälligkeitsdatum darf nicht in der Vergangenheit liegen.

# --- Object page -------------------------------------
# XTIT: Section heading – general invoice information
objectSectionGeneral=Allgemein
# XTIT: Section heading – relevant dates of the invoice
objectSectionDates=Termine
# XTIT: Section heading – free-text note for the invoice
objectSectionNotes=Notizen
# XFLD: Placeholder shown in the (editable) notes text area when no note exists yet
objectNotesPlaceholder=Notiz zur Rechnung erfassen …
# XTIT: Section heading – monetary information
objectSectionAmounts=Beträge
# XTIT: Section heading – invoice line items
objectSectionItems=Rechnungspositionen
# XTIT: Section heading – aggregated tax positions
objectSectionTaxItems=Steuerpositionen
# XTIT: Section heading – file attachments of the invoice
objectSectionAttachments=Anhänge

# --- Invoice items table -----------------------------
# XCOL: Item column – description text
colItemDescription=Beschreibung
# XCOL: Item column – quantity
colItemQuantity=Menge
# XCOL: Item column – price per unit
colItemUnitPrice=Einzelpreis
# XCOL: Item column – tax rate in percent
colItemTaxRate=Steuersatz
# XCOL: Item column – net line amount
colItemAmount=Betrag
# XBUT: Button to add a new invoice line item
actionAddItem=Hinzufügen
# XBUT: Tooltip of the button that removes an invoice line item
actionDeleteItem=Position entfernen
# XMSG: Empty state of the line item table
itemsTableNoData=Keine Rechnungspositionen vorhanden.

# --- Tax positions table -----------------------------
# XCOL: Tax column – tax rate in percent
colTaxRate=Steuersatz
# XCOL: Tax column – tax base (sum of net amounts for this rate)
colTaxBase=Steuerbasis
# XCOL: Tax column – calculated tax amount
colTaxAmount=Steuerbetrag
# XMSG: Empty state of the tax positions table
taxItemsTableNoData=Keine Steuerpositionen vorhanden.

# --- Messages (items) --------------------------------
# XMSG: Error when a line item could not be deleted
messageItemDeleteError=Die Rechnungsposition konnte nicht entfernt werden.

# --- Attachments -------------------------------------
# XCOL: Attachment attribute – file type / extension
colFileType=Dateityp
# XCOL: Attachment attribute – file size
colFileSize=Dateigröße
# XCOL: Attachment attribute – upload date
colUploadedAt=Hochgeladen am
# XMSG: Empty state of the attachments list
attachmentsNoData=Keine Anhänge vorhanden.
# XMSG: Toast shown after an attachment was uploaded successfully
messageAttachmentUploadSuccess=Der Anhang wurde hochgeladen.
# XMSG: Error when an attachment could not be uploaded
messageAttachmentUploadError=Der Anhang konnte nicht hochgeladen werden.
# XMSG: Error when an attachment could not be removed
messageAttachmentDeleteError=Der Anhang konnte nicht entfernt werden.

# --- Object page field labels ------------------------
objectFieldInvoiceNumber=Rechnungsnummer
objectFieldReference=Referenz
objectFieldVendor=Lieferant
objectFieldVendorId=Lieferantennummer
objectFieldCompanyCode=Buchungskreis
objectFieldPaymentTerms=Zahlungsbedingungen
objectFieldCreatedBy=Erfasser
objectFieldInvoiceDate=Rechnungsdatum
objectFieldDueDate=Fälligkeitsdatum
objectFieldPostingDate=Buchungsdatum
objectFieldNetAmount=Nettobetrag
objectFieldTaxAmount=Steuerbetrag
objectFieldGrossAmount=Bruttobetrag
objectFieldCurrency=Währung
objectFieldStatus=Status

# --- Chart: invoices per month -----------------------
# XTIT: Header of the panel containing the invoices-per-month chart
chartPanelTitle=Rechnungen pro Monat
# XAXI: Label of the chart dimension (X axis) – the month
chartDimensionMonth=Monat
# XAXI: Label of the chart measure (Y axis) – number of invoices
chartMeasureCount=Anzahl Rechnungen

# --- NotFound page -----------------------------------
notFoundTitle=Seite nicht gefunden
notFoundDescription=Die aufgerufene Seite konnte nicht gefunden werden. Sie wurden zur Übersicht zurückgeleitet.
